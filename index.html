<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der Fall im Haus - Ein Detektiv-Krimi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Der Fall im Haus</h1>
            <div id="status-bar">
                <span>Phase: <span id="phase-text">Ankunft am Haus</span></span>
                <span id="controls-hint">WASD / Pfeile = Bewegen · E / Leertaste = Interagieren</span>
            </div>
        </header>

        <main>
            <div id="canvas-wrap">
                <canvas id="game"></canvas>
                <div id="prompt"></div>
                <div id="message"></div>
                <div id="closet-ui"></div>
            </div>
        </main>

        <footer>
            <button id="restart">Neustart</button>
            <div id="hint">Suche das Opfer. Durchsuche jedes Zimmer. Überlebe.</div>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
